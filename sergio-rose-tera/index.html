  body {

    background: var(--bg-soft);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

  .hero {
        position: relative;
    padding: 56px 40px 40px;
    text-align: center;
    background: var(--bg);
    border-bottom: 1px solid var(--card-border);
    overflow: hidden;
}

  .hero::before {
        content: '';

    height: 4px;
    background: var(--ig-gradient);
}

  .hero-badge {
        display: inline-flex;
    align-items: center;

    background: var(--ig-gradient);
    border-radius: 100px;
    padding: 8px 22px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
        letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 24px;
}

  .hero h1 {
        font-size: 44px;
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 14px;
    background: var(--ig-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

  .hero-sub {

    color: var(--text-secondary);

    max-width: 620px;

}

  .hero-video { max-width: 680px; margin: 0 auto 28px; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.10); border: 3px solid transparent; background-image: linear-gradient(#fff, #fff), var(--ig-gradient); background-origin: border-box; background-clip: padding-box, border-box; }
      .hero-video iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }

  .hero-meta {

    flex-wrap: wrap;
}

  .hero-meta-item {

    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
}

  .hero-meta-item svg { color: var(--ig-purple); opacity: 0.6; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    max-width: 1200px;
    margin: -28px auto 0;
    padding: 0 40px;

    z-index: 2;
}

      .stat-card {

}

  .stat-card::before {

  .stat-number { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 2px; }

  .stat-card:nth-child(3) .stat-number { color: var(--ig-orange); }
  .stat-card:nth-child(4) .stat-number { color: var(--ig-blue); }

  .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  .main { max-width: 1200px; margin: 0 auto; padding: 32px 40px 80px; }

  .section-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; margin-top: 48px; }
  .section-header:first-child { margin-top: 0; }

        width: 46px; height: 46px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

  .section-header h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
  .section-header p { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

  .priority-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
